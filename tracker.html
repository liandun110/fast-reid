<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图查看器</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        
        #map-container {
            position: relative;
            max-width: 100%;
            max-height: 100%;
        }
        
        #map {
            max-width: 100%;
            max-height: 100vh;
            display: block;
        }
        
        .camera-icon {
            position: absolute;
            font-size: 24px;  /* 图标大小 */
            color: #ff0000;   /* 红色图标 */
            cursor: pointer;
            z-index: 10;
            transform: translate(-50%, -50%); /* 居中定位 */
        }
        
        #preview-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        #preview-wrapper {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }
        
        #preview-image {
            max-width: 100%;
            max-height: 100%;
        }
        
        #detection-canvas {
            position: absolute;
            top: 0;
            left: 0;
            max-width: 100%;
            max-height: 100%;
            cursor: pointer;
        }
        
        #close-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            z-index: 110;
        }

        .detection-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 105;
        }

        .reid-filename {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }
        .reid-exists {
            margin-top: 4px;
            font-size: 13px;
        }
        .reid-exists.exists {
            color: #4CAF50; /* 存在 - 绿色 */
        }
        .reid-exists.not-exists {
            color: #f44336; /* 不存在 - 红色 */
        }
        
        /* 新增提示信息样式 */
        #click-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 128, 0, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        #click-notification.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <img id="map" src="datasets/yisuo/map.png" alt="地图">
        <!-- 摄像头图标将通过JS动态生成 -->
    </div>
    
    <div id="preview-container">
        <span id="close-preview">&times;</span>
        <div id="preview-wrapper">
            <img id="preview-image" src="" alt="预览图">
            <canvas id="detection-canvas"></canvas>
        </div>
        <div class="detection-info">
            点击行人查看检测框 | 共 <span id="person-count">0</span> 个行人
            <div class="reid-filename" id="reid-filename">未选中行人</div>
            <div class="reid-exists" id="reid-exists"></div>
        </div>
    </div>
    
    <!-- 新增提示信息元素 -->
    <div id="click-notification">点击成功</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM元素引用
            const map = document.getElementById('map');
            const mapContainer = document.getElementById('map-container');
            const previewContainer = document.getElementById('preview-container');
            const previewImage = document.getElementById('preview-image');
            const previewWrapper = document.getElementById('preview-wrapper');
            const detectionCanvas = document.getElementById('detection-canvas');
            const ctx = detectionCanvas.getContext('2d');
            const closePreview = document.getElementById('close-preview');
            const personCountElement = document.getElementById('person-count');
            const reidFilenameElement = document.getElementById('reid-filename');
            const reidExistsElement = document.getElementById('reid-exists');
            // 新增提示信息元素引用
            const clickNotification = document.getElementById('click-notification');
            
            // 存储检测数据和状态
            let detectionData = [];
            let selectedPersonId = null;
            let imageWidth = 0;
            let imageHeight = 0;
            let scaleFactor = 1;
            
            // 摄像头配置 - 集中管理所有摄像头信息
            const cameras = [
                { id: '01', dir: '人脸追踪01' },
                { id: '02', dir: '人脸追踪02' },
                { id: '03', dir: '人脸追踪03' },
                { id: '04', dir: '人脸追踪04' },
                { id: '05', dir: '人脸追踪05' },
                { id: '06', dir: '人脸追踪06' },
                { id: '07', dir: '人脸追踪07' },
                { id: '08', dir: '人脸追踪08' },
                { id: '09', dir: '人脸追踪09' },
                { id: '10', dir: '人脸追踪10' },
                // 新增摄像头只需在这里添加配置
            ];

            // 初始化 - 创建所有摄像头图标并加载位置
            function initCameras() {
                cameras.forEach(camera => {
                    // 创建摄像头图标
                    const icon = document.createElement('i');
                    icon.className = 'fa fa-video-camera camera-icon';
                    icon.dataset.cameraId = camera.id;
                    icon.dataset.cameraDir = camera.dir; // 存储目录信息
                    mapContainer.appendChild(icon);
                    
                    // 加载该摄像头的位置信息
                    loadCameraPosition(icon, camera.dir);
                });
            }
            
            // 加载指定摄像头的位置信息
            function loadCameraPosition(icon, cameraDir) {
                const geoPath = `datasets/yisuo/${cameraDir}/geo.json`;
                
                fetch(geoPath)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`无法加载摄像头${cameraDir}的位置文件`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.camera_pos && data.camera_pos.length === 2) {
                            // 存储位置数据
                            icon.dataset.x = data.camera_pos[0];
                            icon.dataset.y = data.camera_pos[1];
                            adjustIconPosition(); // 调整位置
                        }
                    })
                    .catch(error => {
                        console.error('加载摄像头位置出错:', error);
                    });
            }
            
            // 调整地图大小，使长边占满屏幕
            function resizeMap() {
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                const mapRatio = 1152 / 1656; // 地图宽高比
                
                if (windowWidth / windowHeight > mapRatio) {
                    // 窗口比地图更宽，高度占满
                    map.style.height = '100vh';
                    map.style.width = 'auto';
                } else {
                    // 窗口比地图更高，宽度占满
                    map.style.width = '100%';
                    map.style.height = 'auto';
                }
                
                // 调整图标位置
                adjustIconPosition();
            }
            
            // 根据地图实际显示尺寸调整所有图标位置
            function adjustIconPosition() {
                const mapRect = map.getBoundingClientRect();
                const scaleX = mapRect.width / 1152;
                const scaleY = mapRect.height / 1656;
                
                // 调整所有摄像头图标位置
                document.querySelectorAll('.camera-icon').forEach(icon => {
                    if (icon.dataset.x && icon.dataset.y) {
                        const iconX = parseFloat(icon.dataset.x) * scaleX;
                        const iconY = parseFloat(icon.dataset.y) * scaleY;
                        icon.style.left = `${iconX}px`;
                        icon.style.top = `${iconY}px`;
                    }
                });
            }
            
            // 解析YOLO检测结果
            function parseDetectionResults(text) {
                const lines = text.split('\n');
                const results = [];
                
                lines.forEach(line => {
                    line = line.trim();
                    if (!line) return;
                    
                    const parts = line.split(',');
                    if (parts.length !== 10) return;
                    
                    // 解析每行数据
                    const frameId = parseInt(parts[0]);
                    const xCenter = parseFloat(parts[2]);
                    const yCenter = parseFloat(parts[3]);
                    const width = parseFloat(parts[4]);
                    const height = parseFloat(parts[5]);
                    const confidence = parseFloat(parts[6]);
                    const detectionId = parseInt(parts[9]);
                    
                    // 只关心第一帧的检测结果
                    if (frameId === 1) {
                        results.push({
                            frameId,
                            xCenter,
                            yCenter,
                            width,
                            height,
                            confidence,
                            detectionId
                        });
                    }
                });
                
                return results;
            }
            
            // 生成ReID特征文件名
            function getReidFilename(person, frameName) {
                return `${person.detectionId.toString().padStart(6, '0')}_c1s1_${frameName}_${person.confidence.toFixed(4)}.npy`;
            }

            // 获取ReID文件路径
            function getReidFilePath(person, cameraDir, frameName) {
                const reidBasePath = `datasets/yisuo/${cameraDir}/reid_features/`;
                const filename = getReidFilename(person, frameName);
                return `${reidBasePath}${filename}`;
            }

            // 检查ReID文件是否存在
            function checkReidFileExists(filePath) {
                return fetch(filePath, { method: 'HEAD' })
                    .then(response => response.ok)
                    .catch(() => false);
            }
            
            // 加载检测数据
            function loadDetectionData(cameraDir) {
                const detPath = `datasets/yisuo/${cameraDir}/det/det_yolov8x.txt`;
                
                return fetch(detPath)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('无法加载检测数据文件');
                        }
                        return response.text();
                    })
                    .then(text => {
                        detectionData = parseDetectionResults(text);
                        personCountElement.textContent = detectionData.length;
                        return detectionData;
                    })
                    .catch(error => {
                        console.error('加载检测数据出错:', error);
                        personCountElement.textContent = '加载失败';
                        return [];
                    });
            }
            
            // 绘制检测框
            function drawDetections() {
                // 清除画布
                ctx.clearRect(0, 0, detectionCanvas.width, detectionCanvas.height);
                
                // 获取图像显示尺寸
                const rect = previewImage.getBoundingClientRect();
                const wrapperRect = previewWrapper.getBoundingClientRect();
                
                // 计算缩放因子和偏移量
                scaleFactor = rect.width / imageWidth;
                const offsetX = rect.left - wrapperRect.left;
                const offsetY = rect.top - wrapperRect.top;
                
                // 设置画布尺寸匹配图像显示尺寸
                detectionCanvas.width = rect.width;
                detectionCanvas.height = rect.height;
                detectionCanvas.style.width = `${rect.width}px`;
                detectionCanvas.style.height = `${rect.height}px`;
                
                // 绘制所有检测框
                detectionData.forEach(person => {
                    // 计算实际坐标 (YOLO输出是归一化坐标)
                    const x = (person.xCenter - person.width / 2) * imageWidth * scaleFactor;
                    const y = (person.yCenter - person.height / 2) * imageHeight * scaleFactor;
                    const w = person.width * imageWidth * scaleFactor;
                    const h = person.height * imageHeight * scaleFactor;
                    
                    // 绘制边框
                    ctx.strokeStyle = person.detectionId === selectedPersonId ? '#00ff00' : '#ff0000';
                    ctx.lineWidth = person.detectionId === selectedPersonId ? 3 : 2;
                    ctx.strokeRect(x, y, w, h);
                    
                    // 绘制ID标签
                    ctx.fillStyle = person.detectionId === selectedPersonId ? 'rgba(0, 255, 0, 0.7)' : 'rgba(255, 0, 0, 0.7)';
                    ctx.fillRect(x, y - 20, 40, 20);
                    ctx.fillStyle = 'white';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`ID: ${person.detectionId}`, x + 20, y - 10);
                });
            }
            
            // 处理预览图像点击事件
            function handleImageClick(e) {
                const rect = detectionCanvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                // 检查点击位置是否在某个行人框内
                let selected = null;
                let selectedPerson = null;
                detectionData.forEach(person => {
                    const x = (person.xCenter - person.width / 2) * imageWidth * scaleFactor;
                    const y = (person.yCenter - person.height / 2) * imageHeight * scaleFactor;
                    const w = person.width * imageWidth * scaleFactor;
                    const h = person.height * imageHeight * scaleFactor;
                    
                    if (clickX >= x && clickX <= x + w && clickY >= y && clickY <= y + h) {
                        selected = person.detectionId;
                        selectedPerson = person;
                    }
                });
                
                // 更新选中状态并重新绘制
                selectedPersonId = selected !== selectedPersonId ? selected : null;
                
                // 检查文件存在性并更新显示
                if (selectedPersonId && selectedPerson) {
                    // 获取当前摄像头目录
                    const activeCamera = document.querySelector('.camera-icon[data-active="true"]');
                    const cameraDir = activeCamera?.dataset.cameraDir;
                    const frameName = '000001'; // 从图片名提取
                    
                    if (cameraDir) {
                        const filePath = getReidFilePath(selectedPerson, cameraDir, frameName);
                        const filename = filePath.split('/').pop();
                        reidFilenameElement.textContent = `ReID文件: ${filename}`;
                        
                        checkReidFileExists(filePath).then(exists => {
                            if (exists) {
                                reidExistsElement.textContent = "状态：文件存在，正在查找相似特征...";
                                reidExistsElement.className = "reid-exists exists";
                                
                                // 调用后端API查找相似特征
                                fetch('http://localhost:5000/api/find_similar', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({ detection_id: selectedPersonId })
                                })
                                .then(response => {
                                    if (!response.ok) throw new Error('请求失败');
                                    return response.json();
                                })
                                .then(result => {
                                    if (result.error) {
                                        reidExistsElement.textContent = `状态：${result.error}`;
                                    } else {
                                        reidExistsElement.textContent = 
                                            `最相似: ${result.most_similar.file_name} (${result.most_similar.similarity_percent})`;
                                    }
                                })
                                .catch(error => {
                                    console.error('API调用错误:', error);
                                    reidExistsElement.textContent = "状态：查找相似特征失败";
                                });
                            } else {
                                reidExistsElement.textContent = "状态：文件不存在";
                                reidExistsElement.className = "reid-exists not-exists";
                            }
                        });
                    }
                } else {
                    reidFilenameElement.textContent = '未选中行人';
                    reidExistsElement.textContent = '';
                }
                
                drawDetections();
            }
            
            // 显示点击提示的函数
            function showClickNotification() {
                // 显示提示
                clickNotification.classList.add('show');
                
                // 3秒后隐藏提示
                setTimeout(() => {
                    clickNotification.classList.remove('show');
                }, 3000);
            }
            
            // 摄像头点击处理函数
            function handleCameraClick(e) {
                // 显示点击成功提示
                showClickNotification();
                
                const camera = e.currentTarget;
                const cameraId = camera.dataset.cameraId;
                const cameraDir = camera.dataset.cameraDir;
                
                // 标记当前活动摄像头
                document.querySelectorAll('.camera-icon').forEach(icon => {
                    icon.removeAttribute('data-active');
                });
                camera.dataset.active = "true";
                
                // 统一路径规则：datasets/yisuo/*/img1/000001.jpg
                const imagePath = `datasets/yisuo/${cameraDir}/img1/000001.jpg`;
                
                previewImage.src = imagePath;
                previewContainer.style.display = 'flex';
                selectedPersonId = null;
                reidFilenameElement.textContent = '未选中行人';
                reidExistsElement.textContent = '';
                
                // 加载对应摄像头的检测数据
                loadDetectionData(cameraDir).then(() => {
                    // 处理图片加载完成事件
                    const handleImageLoad = function() {
                        imageWidth = this.naturalWidth;
                        imageHeight = this.naturalHeight;
                        drawDetections();
                        // 移除事件监听避免重复触发
                        previewImage.removeEventListener('load', handleImageLoad);
                    };
                    
                    previewImage.addEventListener('load', handleImageLoad);
                    
                    // 如果图片已经缓存，手动触发加载事件
                    if (previewImage.complete) {
                        handleImageLoad.call(previewImage);
                    }
                });
            }
            
            // 关闭预览
            function closePreviewHandler() {
                previewContainer.style.display = 'none';
                detectionData = [];
                selectedPersonId = null;
                reidFilenameElement.textContent = '未选中行人';
                reidExistsElement.textContent = '';
                // 清除活动摄像头标记
                document.querySelectorAll('.camera-icon').forEach(icon => {
                    icon.removeAttribute('data-active');
                });
            }
            
            // 事件绑定
            closePreview.addEventListener('click', closePreviewHandler);
            previewContainer.addEventListener('click', function(e) {
                if (e.target === previewContainer) {
                    closePreviewHandler();
                }
            });
            detectionCanvas.addEventListener('click', handleImageClick);
            window.addEventListener('resize', function() {
                resizeMap();
                // 如果预览窗口打开，重新绘制检测框
                if (previewContainer.style.display === 'flex' && detectionData.length > 0) {
                    drawDetections();
                }
            });
            map.addEventListener('load', resizeMap);
            
            // 初始化
            resizeMap();
            initCameras(); // 初始化摄像头
            
            // 为所有摄像头图标绑定点击事件
            document.querySelectorAll('.camera-icon').forEach(icon => {
                icon.addEventListener('click', handleCameraClick);
            });
        });
    </script>
</body>
</html>
