<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图查看器</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        
        #map-container {
            position: relative;
            max-width: 100%;
            max-height: 100%;
        }
        
        #map {
            max-width: 100%;
            max-height: 100vh;
            display: block;
        }
        
        .camera-icon {
            position: absolute;
            font-size: 24px;  /* 图标大小 */
            color: #ff0000;   /* 红色图标 */
            cursor: pointer;
            z-index: 10;
            transform: translate(-50%, -50%); /* 居中定位 */
        }
        
        /* 新增：相似行人裁剪图样式 */
        .similar-person {
            position: absolute;
            width: 30px;
            height: 80px;
            border: 2px solid #4CAF50;
            border-radius: 4px;
            background-color: white;
            overflow: hidden;
            z-index: 20;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .similar-person img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .similar-person .similarity {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0,0,0,0.7);
            color: white;
            font-size: 12px;
            text-align: center;
            padding: 2px 0;
        }
        
        #preview-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        #preview-wrapper {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }
        
        #preview-image {
            max-width: 100%;
            max-height: 100%;
        }
        
        #detection-canvas {
            position: absolute;
            top: 0;
            left: 0;
            max-width: 100%;
            max-height: 100%;
            cursor: pointer;
        }
        
        #close-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            z-index: 110;
        }

        .detection-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 105;
        }

        .reid-filename {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }
        .reid-exists {
            margin-top: 4px;
            font-size: 13px;
        }
        .reid-exists.exists {
            color: #4CAF50; /* 存在 - 绿色 */
        }
        .reid-exists.not-exists {
            color: #f44336; /* 不存在 - 红色 */
        }
        
        #click-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 128, 0, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        #click-notification.show {
            opacity: 1;
        }
        
        /* 新增：清除相似结果按钮 */
        #clear-similar {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 30;
            display: none;
        }
        
        /* 新增：轨迹线样式 */
        #track-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }
        
        /* 新增：时间点标记样式 */
        .time-marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #2196F3;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 16;
        }
        
        .time-label {
            position: absolute;
            background-color: rgba(33, 150, 243, 0.9);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 17;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <img id="map" src="datasets/yisuo/map.png" alt="地图">
        <!-- 新增：轨迹画布 -->
        <canvas id="track-canvas"></canvas>
        <!-- 摄像头图标将通过JS动态生成 -->
    </div>
    
    <div id="preview-container">
        <span id="close-preview">&times;</span>
        <div id="preview-wrapper">
            <img id="preview-image" src="" alt="预览图">
            <canvas id="detection-canvas"></canvas>
        </div>
        <div class="detection-info">
            点击行人查看检测框 | 共 <span id="person-count">0</span> 个行人
            <div class="reid-filename" id="reid-filename">未选中行人</div>
            <div class="reid-exists" id="reid-exists"></div>
        </div>
    </div>
    
    <div id="click-notification">点击成功</div>
    <!-- 新增：清除相似结果按钮 -->
    <button id="clear-similar">清除相似结果</button>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM元素引用
            const map = document.getElementById('map');
            const mapContainer = document.getElementById('map-container');
            const previewContainer = document.getElementById('preview-container');
            const previewImage = document.getElementById('preview-image');
            const previewWrapper = document.getElementById('preview-wrapper');
            const detectionCanvas = document.getElementById('detection-canvas');
            const ctx = detectionCanvas.getContext('2d');
            const closePreview = document.getElementById('close-preview');
            const personCountElement = document.getElementById('person-count');
            const reidFilenameElement = document.getElementById('reid-filename');
            const reidExistsElement = document.getElementById('reid-exists');
            const clickNotification = document.getElementById('click-notification');
            const clearSimilarBtn = document.getElementById('clear-similar');
            // 新增：轨迹画布
            const trackCanvas = document.getElementById('track-canvas');
            const trackCtx = trackCanvas.getContext('2d');
            
            // 存储检测数据和状态
            let detectionData = [];
            let selectedPersonId = null;
            let selectedCameraDir = null;
            let imageWidth = 0;
            let imageHeight = 0;
            let scaleFactor = 1;
            let similarPersons = []; // 存储相似行人数据
            
            // 摄像头配置
            const cameras = [
                { id: '01', dir: '人脸追踪01' },
                { id: '02', dir: '人脸追踪02' },
                { id: '03', dir: '人脸追踪03' },
                { id: '04', dir: '人脸追踪04' },
                { id: '05', dir: '人脸追踪05' },
                { id: '06', dir: '人脸追踪06' },
                { id: '07', dir: '人脸追踪07' },
                { id: '08', dir: '人脸追踪08' },
                { id: '09', dir: '人脸追踪09' },
                { id: '10', dir: '人脸追踪10' },
            ];

            // 初始化摄像头
            function initCameras() {
                cameras.forEach(camera => {
                    const icon = document.createElement('i');
                    icon.className = 'fa fa-video-camera camera-icon';
                    icon.dataset.cameraId = camera.id;
                    icon.dataset.cameraDir = camera.dir;
                    mapContainer.appendChild(icon);
                    loadCameraPosition(icon, camera.dir);
                });
            }
            
            // 加载摄像头位置
            function loadCameraPosition(icon, cameraDir) {
                const geoPath = `datasets/yisuo/${cameraDir}/geo.json`;
                
                fetch(geoPath)
                    .then(response => {
                        if (!response.ok) throw new Error(`无法加载摄像头${cameraDir}的位置文件`);
                        return response.json();
                    })
                    .then(data => {
                        if (data.camera_pos && data.camera_pos.length === 2) {
                            icon.dataset.x = data.camera_pos[0];
                            icon.dataset.y = data.camera_pos[1];
                            adjustIconPosition();
                        }
                    })
                    .catch(error => console.error('加载摄像头位置出错:', error));
            }
            
            // 调整地图大小
            function resizeMap() {
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                const mapRatio = 1152 / 1656;
                
                if (windowWidth / windowHeight > mapRatio) {
                    map.style.height = '100vh';
                    map.style.width = 'auto';
                } else {
                    map.style.width = '100%';
                    map.style.height = 'auto';
                }
                
                // 调整轨迹画布大小
                const mapRect = map.getBoundingClientRect();
                trackCanvas.width = mapRect.width;
                trackCanvas.height = mapRect.height;
                
                adjustIconPosition();
                // 重新定位相似行人图像
                positionSimilarPersons();
                // 重新绘制轨迹
                drawTracks();
            }
            
            // 调整图标位置
            function adjustIconPosition() {
                const mapRect = map.getBoundingClientRect();
                const scaleX = mapRect.width / 1152;
                const scaleY = mapRect.height / 1656;
                
                document.querySelectorAll('.camera-icon').forEach(icon => {
                    if (icon.dataset.x && icon.dataset.y) {
                        const iconX = parseFloat(icon.dataset.x) * scaleX;
                        const iconY = parseFloat(icon.dataset.y) * scaleY;
                        icon.style.left = `${iconX}px`;
                        icon.style.top = `${iconY}px`;
                    }
                });
            }
            
            // 解析YOLO检测结果
            function parseDetectionResults(text) {
                const lines = text.split('\n');
                const results = [];
                
                lines.forEach(line => {
                    line = line.trim();
                    if (!line) return;
                    
                    const parts = line.split(',');
                    if (parts.length !== 10) return;
                    
                    const frameId = parseInt(parts[0]);
                    const xCenter = parseFloat(parts[2]);
                    const yCenter = parseFloat(parts[3]);
                    const width = parseFloat(parts[4]);
                    const height = parseFloat(parts[5]);
                    const confidence = parseFloat(parts[6]);
                    const detectionId = parseInt(parts[9]);
                    
                    if (frameId === 1) {
                        results.push({
                            frameId,
                            xCenter,
                            yCenter,
                            width,
                            height,
                            confidence,
                            detectionId
                        });
                    }
                });
                
                return results;
            }
            
            // 生成ReID特征文件名
            function getReidFilename(person, frameName) {
                return `${person.detectionId.toString().padStart(6, '0')}_c1s1_${frameName}_${person.confidence.toFixed(4)}.npy`;
            }

            // 获取ReID文件路径
            function getReidFilePath(person, cameraDir, frameName) {
                const reidBasePath = `datasets/yisuo/${cameraDir}/reid_features/`;
                const filename = getReidFilename(person, frameName);
                return `${reidBasePath}${filename}`;
            }

            // 检查ReID文件是否存在
            function checkReidFileExists(filePath) {
                return fetch(filePath, { method: 'HEAD' })
                    .then(response => response.ok)
                    .catch(() => false);
            }
            
            // 加载检测数据
            function loadDetectionData(cameraDir) {
                const detPath = `datasets/yisuo/${cameraDir}/det/det_yolov8x.txt`;
                
                return fetch(detPath)
                    .then(response => {
                        if (!response.ok) throw new Error('无法加载检测数据文件');
                        return response.text();
                    })
                    .then(text => {
                        detectionData = parseDetectionResults(text);
                        personCountElement.textContent = detectionData.length;
                        return detectionData;
                    })
                    .catch(error => {
                        console.error('加载检测数据出错:', error);
                        personCountElement.textContent = '加载失败';
                        return [];
                    });
            }
            
            // 绘制检测框
            function drawDetections() {
                ctx.clearRect(0, 0, detectionCanvas.width, detectionCanvas.height);
                
                const rect = previewImage.getBoundingClientRect();
                const wrapperRect = previewWrapper.getBoundingClientRect();
                
                scaleFactor = rect.width / imageWidth;
                const offsetX = rect.left - wrapperRect.left;
                const offsetY = rect.top - wrapperRect.top;
                
                detectionCanvas.width = rect.width;
                detectionCanvas.height = rect.height;
                detectionCanvas.style.width = `${rect.width}px`;
                detectionCanvas.style.height = `${rect.height}px`;
                
                detectionData.forEach(person => {
                    const x = (person.xCenter - person.width / 2) * imageWidth * scaleFactor;
                    const y = (person.yCenter - person.height / 2) * imageHeight * scaleFactor;
                    const w = person.width * imageWidth * scaleFactor;
                    const h = person.height * imageHeight * scaleFactor;
                    
                    ctx.strokeStyle = person.detectionId === selectedPersonId ? '#00ff00' : '#ff0000';
                    ctx.lineWidth = person.detectionId === selectedPersonId ? 3 : 2;
                    ctx.strokeRect(x, y, w, h);
                    
                    ctx.fillStyle = person.detectionId === selectedPersonId ? 'rgba(0, 255, 0, 0.7)' : 'rgba(255, 0, 0, 0.7)';
                    ctx.fillRect(x, y - 20, 40, 20);
                    ctx.fillStyle = 'white';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`ID: ${person.detectionId}`, x + 20, y - 10);
                });
            }
            
            // 检查两个矩形是否重叠
            function isOverlapping(rect1, rect2) {
                return !(
                    rect1.right < rect2.left ||
                    rect1.left > rect2.right ||
                    rect1.bottom < rect2.top ||
                    rect1.top > rect2.bottom
                );
            }
            
            // 计算相似行人图像位置，避免重叠
            function calculatePosition(cameraIcon, existingElements) {
                const mapRect = map.getBoundingClientRect();
                const scaleX = mapRect.width / 1152;
                const scaleY = mapRect.height / 1656;
                
                const baseX = parseFloat(cameraIcon.dataset.x) * scaleX;
                const baseY = parseFloat(cameraIcon.dataset.y) * scaleY;
                
                // 图像尺寸
                const imgWidth = 100;
                const imgHeight = 150;
                
                // 尝试不同的位置偏移，寻找不重叠的位置
                const offsets = [
                    {x: imgWidth/2, y: 0},          // 右侧
                    {x: -imgWidth/2, y: 0},         // 左侧
                    {x: 0, y: imgHeight/2},         // 下方
                    {x: 0, y: -imgHeight/2},        // 上方
                    {x: imgWidth/2, y: imgHeight/2}, // 右下
                    {x: -imgWidth/2, y: imgHeight/2}, // 左下
                    {x: imgWidth/2, y: -imgHeight/2}, // 右上
                    {x: -imgWidth/2, y: -imgHeight/2} // 左上
                ];
                
                // 检查每个可能的位置
                for (const offset of offsets) {
                    const posX = baseX + offset.x;
                    const posY = baseY + offset.y;
                    
                    const newRect = {
                        left: posX - imgWidth/2,
                        top: posY - imgHeight/2,
                        right: posX + imgWidth/2,
                        bottom: posY + imgHeight/2
                    };
                    
                    // 检查是否与现有元素重叠
                    let overlap = false;
                    for (const elem of existingElements) {
                        if (isOverlapping(newRect, elem.rect)) {
                            overlap = true;
                            break;
                        }
                    }
                    
                    // 检查是否在地图范围内
                    if (!overlap && 
                        newRect.left >= 0 && 
                        newRect.top >= 0 && 
                        newRect.right <= mapRect.width && 
                        newRect.bottom <= mapRect.height) {
                        return {
                            x: posX,
                            y: posY,
                            rect: newRect
                        };
                    }
                }
                
                // 如果所有位置都重叠，则使用基础位置并添加轻微偏移
                return {
                    x: baseX + imgWidth/2,
                    y: baseY + imgHeight/2,
                    rect: {
                        left: baseX,
                        top: baseY,
                        right: baseX + imgWidth,
                        bottom: baseY + imgHeight
                    }
                };
            }
            
            // 定位所有相似行人图像
            function positionSimilarPersons() {
                const existingElements = [];
                document.querySelectorAll('.similar-person').forEach(elem => {
                    const rect = elem.getBoundingClientRect();
                    const mapRect = map.getBoundingClientRect();
                    
                    existingElements.push({
                        id: elem.dataset.cameraId,
                        rect: {
                            left: rect.left - mapRect.left,
                            top: rect.top - mapRect.top,
                            right: rect.right - mapRect.left,
                            bottom: rect.bottom - mapRect.top
                        }
                    });
                });
                
                document.querySelectorAll('.similar-person').forEach(elem => {
                    const cameraId = elem.dataset.cameraId;
                    const cameraIcon = document.querySelector(`.camera-icon[data-camera-id="${cameraId}"]`);
                    
                    if (cameraIcon) {
                        const position = calculatePosition(cameraIcon, existingElements.filter(e => e.id !== cameraId));
                        elem.style.left = `${position.x}px`;
                        elem.style.top = `${position.y}px`;
                    }
                });
            }
            
            // 新增：按时间排序相似行人
            function sortPersonsByTime(persons) {
                return [...persons].sort((a, b) => {
                    return new Date(a.video_start_time) - new Date(b.video_start_time);
                });
            }
            
            // 新增：绘制轨迹
            function drawTracks() {
                // 清除现有轨迹
                trackCtx.clearRect(0, 0, trackCanvas.width, trackCanvas.height);
                
                if (similarPersons.length <= 1) return;
                
                // 按时间排序
                const sortedPersons = sortPersonsByTime(similarPersons);
                
                const mapRect = map.getBoundingClientRect();
                const scaleX = mapRect.width / 1152;
                const scaleY = mapRect.height / 1656;
                
                // 收集所有点的坐标
                const points = [];
                sortedPersons.forEach(person => {
                    const cameraIcon = document.querySelector(`.camera-icon[data-camera-dir="${person.camera_dir}"]`);
                    if (cameraIcon && cameraIcon.dataset.x && cameraIcon.dataset.y) {
                        const x = parseFloat(cameraIcon.dataset.x) * scaleX;
                        const y = parseFloat(cameraIcon.dataset.y) * scaleY;
                        points.push({ x, y, time: person.video_start_time });
                    }
                });
                
                // 绘制轨迹线
                if (points.length >= 2) {
                    trackCtx.beginPath();
                    trackCtx.moveTo(points[0].x, points[0].y);
                    
                    for (let i = 1; i < points.length; i++) {
                        trackCtx.lineTo(points[i].x, points[i].y);
                    }
                    
                    trackCtx.strokeStyle = 'rgba(33, 150, 243, 0.8)';
                    trackCtx.lineWidth = 3;
                    trackCtx.setLineDash([5, 5]);
                    trackCtx.stroke();
                    trackCtx.setLineDash([]);
                }
                
                // 绘制时间点标记
                points.forEach((point, index) => {
                    // 创建或更新时间标记
                    let marker = document.querySelector(`.time-marker[data-index="${index}"]`);
                    let label = document.querySelector(`.time-label[data-index="${index}"]`);
                    
                    if (!marker) {
                        marker = document.createElement('div');
                        marker.className = 'time-marker';
                        marker.dataset.index = index;
                        mapContainer.appendChild(marker);
                    }
                    
                    if (!label) {
                        label = document.createElement('div');
                        label.className = 'time-label';
                        label.dataset.index = index;
                        mapContainer.appendChild(label);
                    }
                    
                    // 设置位置和内容
                    marker.style.left = `${point.x}px`;
                    marker.style.top = `${point.y}px`;
                    
                    // 格式化时间显示
                    console.log(point.time)
                    
                    // 处理"20241121163305"格式的时间字符串
                    const timeStr = point.time; // "20241121163305"

                    // 拆分年月日时分秒（字符串截取）
                    const year = timeStr.substring(0, 4);      // 2024
                    const month = timeStr.substring(4, 6);     // 11
                    const day = timeStr.substring(6, 8);       // 21
                    const hour = timeStr.substring(8, 10);     // 16
                    const minute = timeStr.substring(10, 12);  // 33
                    const second = timeStr.substring(12, 14);  // 05

                    // 拼接为Date可识别的格式（ISO 8601）
                    const isoTime = `${year}-${month}-${day}T${hour}:${minute}:${second}`;

                    // 创建正确的Date对象
                    const time = new Date(isoTime);
                    
                    const formattedTime = `${time.getHours().toString().padStart(2, '0')}:${time.getMinutes().toString().padStart(2, '0')}:${time.getSeconds().toString().padStart(2, '0')}`;
                    label.textContent = formattedTime;
                    console.log(formattedTime);
                    
                    // 定位标签，避免重叠
                    const labelOffset = 15;
                    if (index % 2 === 0) {
                        label.style.left = `${point.x + labelOffset}px`;
                        label.style.top = `${point.y - 10}px`;
                    } else {
                        label.style.left = `${point.x - labelOffset}px`;
                        label.style.top = `${point.y + 10}px`;
                        label.style.textAlign = 'right';
                    }
                });
            }
            
            // 显示相似行人
            function showSimilarPersons(similarData) {
                console.log(`成功调用showSimilarPersons，共加载 ${similarData.length} 个相似行人`);
                // 先清除现有相似行人图像和轨迹
                clearSimilarPersons();
                
                similarPersons = similarData;
                const existingElements = [];
                
                // 为每个摄像头创建相似行人图像元素
                similarData.forEach(item => {
                    const cameraIcon = document.querySelector(`.camera-icon[data-camera-dir="${item.camera_dir}"]`);
                    if (!cameraIcon) return;
                    
                    const position = calculatePosition(cameraIcon, existingElements);
                    console.log(`行人在摄像头 [${cameraIcon.dataset.cameraId}] 中的位置：X=${position.x.toFixed(2)}, Y=${position.y.toFixed(2)}`);
                    
                    const similarElem = document.createElement('div');
                    similarElem.className = 'similar-person';
                    similarElem.dataset.cameraId = item.camera_id;
                    similarElem.dataset.cameraDir = item.camera_dir;
                    similarElem.dataset.time = item.video_start_time; // 存储时间信息
                    similarElem.style.left = `${position.x}px`;
                    similarElem.style.top = `${position.y}px`;
                    
                    const img = document.createElement('img');
                    img.src = item.crop_image_url;
                    img.alt = `相似行人 (${item.similarity_percent})`;
                    
                    const similarityLabel = document.createElement('div');
                    similarityLabel.className = 'similarity';
                    similarityLabel.textContent = `时间: ${item.video_start_time}`;
                    
                    similarElem.appendChild(img);
                    similarElem.appendChild(similarityLabel);
                    mapContainer.appendChild(similarElem);
                    
                    existingElements.push({
                        id: item.camera_id,
                        rect: position.rect
                    });
                });
                
                // 绘制轨迹
                drawTracks();
                
                // 显示清除按钮
                clearSimilarBtn.style.display = 'block';
            }
            
            // 清除相似行人图像和轨迹
            function clearSimilarPersons() {
                document.querySelectorAll('.similar-person').forEach(elem => {
                    elem.remove();
                });
                // 清除时间标记
                document.querySelectorAll('.time-marker, .time-label').forEach(elem => {
                    elem.remove();
                });
                // 清除轨迹
                trackCtx.clearRect(0, 0, trackCanvas.width, trackCanvas.height);
                
                similarPersons = [];
                clearSimilarBtn.style.display = 'none';
            }
            
            // 处理预览图像点击事件
            function handleImageClick(e) {
                const rect = detectionCanvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                let selected = null;
                let selectedPerson = null;
                detectionData.forEach(person => {
                    const x = (person.xCenter - person.width / 2) * imageWidth * scaleFactor;
                    const y = (person.yCenter - person.height / 2) * imageHeight * scaleFactor;
                    const w = person.width * imageWidth * scaleFactor;
                    const h = person.height * imageHeight * scaleFactor;
                    
                    if (clickX >= x && clickX <= x + w && clickY >= y && clickY <= y + h) {
                        selected = person.detectionId;
                        selectedPerson = person;
                    }
                });
                
                selectedPersonId = selected !== selectedPersonId ? selected : null;
                
                if (selectedPersonId && selectedPerson) {
                    const activeCamera = document.querySelector('.camera-icon[data-active="true"]');
                    const cameraDir = activeCamera?.dataset.cameraDir;
                    const frameName = '000001';
                    
                    selectedCameraDir = cameraDir;
                    
                    if (cameraDir) {
                        const filePath = getReidFilePath(selectedPerson, cameraDir, frameName);
                        const filename = filePath.split('/').pop();
                        reidFilenameElement.textContent = `ReID文件: ${filename}`;
                        
                        checkReidFileExists(filePath).then(exists => {
                            if (exists) {
                                reidExistsElement.textContent = "状态：文件存在，正在查找所有摄像头相似特征...";
                                reidExistsElement.className = "reid-exists exists";
                                
                                // 调用后端API查找所有摄像头的相似特征
                                fetch('http://localhost:5000/api/find_all_similar', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({ 
                                        detection_id: selectedPersonId,
                                        source_camera_dir: cameraDir
                                    })
                                })
                                .then(response => {
                                    if (!response.ok) throw new Error('请求失败');
                                    return response.json();
                                })
                                .then(result => {
                                    if (result.error) {
                                        reidExistsElement.textContent = `状态：${result.error}`;
                                    } else {
                                        reidExistsElement.textContent = `已找到 ${result.similar_persons.length} 个相似行人`;
                                        // 显示所有相似行人
                                        showSimilarPersons(result.similar_persons);
                                    }
                                })
                                .catch(error => {
                                    console.error('API调用错误:', error);
                                    reidExistsElement.textContent = "状态：查找相似特征失败";
                                });
                            } else {
                                reidExistsElement.textContent = "状态：文件不存在";
                                reidExistsElement.className = "reid-exists not-exists";
                                clearSimilarPersons();
                            }
                        });
                    }
                } else {
                    reidFilenameElement.textContent = '未选中行人';
                    reidExistsElement.textContent = '';
                    clearSimilarPersons();
                }
                
                drawDetections();
            }
            
            // 显示点击提示
            function showClickNotification() {
                clickNotification.classList.add('show');
                setTimeout(() => {
                    clickNotification.classList.remove('show');
                }, 3000);
            }
            
            // 摄像头点击处理
            function handleCameraClick(e) {
                showClickNotification();
                
                const camera = e.currentTarget;
                const cameraId = camera.dataset.cameraId;
                const cameraDir = camera.dataset.cameraDir;
                
                document.querySelectorAll('.camera-icon').forEach(icon => {
                    icon.removeAttribute('data-active');
                });
                camera.dataset.active = "true";
                
                const imagePath = `datasets/yisuo/${cameraDir}/img1/000001.jpg`;
                
                previewImage.src = imagePath;
                previewContainer.style.display = 'flex';
                selectedPersonId = null;
                reidFilenameElement.textContent = '未选中行人';
                reidExistsElement.textContent = '';
                clearSimilarPersons();
                
                loadDetectionData(cameraDir).then(() => {
                    const handleImageLoad = function() {
                        imageWidth = this.naturalWidth;
                        imageHeight = this.naturalHeight;
                        drawDetections();
                        previewImage.removeEventListener('load', handleImageLoad);
                    };
                    
                    previewImage.addEventListener('load', handleImageLoad);
                    
                    if (previewImage.complete) {
                        handleImageLoad.call(previewImage);
                    }
                });
            }
            
            // 关闭预览
            function closePreviewHandler() {
                previewContainer.style.display = 'none';
                detectionData = [];
                selectedPersonId = null;
                selectedCameraDir = null;
                reidFilenameElement.textContent = '未选中行人';
                reidExistsElement.textContent = '';
                document.querySelectorAll('.camera-icon').forEach(icon => {
                    icon.removeAttribute('data-active');
                });
                positionSimilarPersons(); // 关闭后重新定位子图
            }
            
            // 事件绑定
            closePreview.addEventListener('click', closePreviewHandler);
            previewContainer.addEventListener('click', function(e) {
                if (e.target === previewContainer) {
                    closePreviewHandler();
                }
            });
            detectionCanvas.addEventListener('click', handleImageClick);
            window.addEventListener('resize', resizeMap);
            map.addEventListener('load', resizeMap);
            clearSimilarBtn.addEventListener('click', clearSimilarPersons);
            
            // 初始化
            resizeMap();
            initCameras();
            
            document.querySelectorAll('.camera-icon').forEach(icon => {
                icon.addEventListener('click', handleCameraClick);
            });
        });
    </script>
</body>
</html>
